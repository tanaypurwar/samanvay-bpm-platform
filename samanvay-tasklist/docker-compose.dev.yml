# PostgreSQL for trying the "prod" profile locally (the default "dev" profile uses H2 and needs nothing).
#   docker compose -f docker-compose.dev.yml up -d
#   SAMANVAY_TASKLIST_DB_PASSWORD=tasklist ../mvnw spring-boot:run -Dspring-boot.run.profiles=prod
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: samanvay
      POSTGRES_USER: tasklist
      POSTGRES_PASSWORD: tasklist
    ports:
      - "5432:5432"
    volumes:
      - tasklist-pg:/var/lib/postgresql/data

volumes:
  tasklist-pg:
