server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        name: SAMANVAY_TASKLIST_SESSION

spring:
  application:
    name: samanvay-tasklist
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  servlet:
    multipart:
      # documents: up to samanvay.documents.max-file-size each, several per request when starting a process
      max-file-size: 10MB
      max-request-size: 60MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

samanvay:
  engine:
    # Camunda 7 REST API of the Samanvay BPM engine
    base-url: ${SAMANVAY_ENGINE_BASE_URL:http://localhost:8080/engine-rest}
    # service account the tasklist uses to call the engine; never sent to the browser
    username: ${SAMANVAY_ENGINE_USERNAME:demo}
    password: ${SAMANVAY_ENGINE_PASSWORD:demo}
    connect-timeout: 5s
    read-timeout: 15s
  tasklist:
    # Camunda groups whose members may manage form configuration
    admin-groups: ${SAMANVAY_TASKLIST_ADMIN_GROUPS:camunda-admin,tasklist-admin}
    # per-deployment branding (SAMANVAY_TASKLIST_BRANDING_NAME, _PRODUCT, _PRIMARY_COLOR, _SECONDARY_COLOR,
    # _LOGO_URL)
    branding:
      name: Samanvay
      product: Tasklist
  # documents attached to processes (PDF, JPEG, PNG), stored in S3; off while the bucket is empty
  documents:
    bucket: ${SAMANVAY_DOCUMENTS_BUCKET:}
    region: ${SAMANVAY_DOCUMENTS_REGION:ap-south-1}
    # S3-compatible store instead of AWS (e.g. http://s3:9000 locally); empty for AWS S3
    endpoint: ${SAMANVAY_DOCUMENTS_ENDPOINT:}
    # empty: default AWS credentials (EC2 instance role, environment, profile)
    access-key: ${SAMANVAY_DOCUMENTS_ACCESS_KEY:}
    secret-key: ${SAMANVAY_DOCUMENTS_SECRET_KEY:}
    create-bucket: ${SAMANVAY_DOCUMENTS_CREATE_BUCKET:false}
    max-file-size: 10MB
    max-files-per-upload: 10
