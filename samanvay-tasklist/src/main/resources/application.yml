server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        name: SAMANVAY_TASKLIST_SESSION

spring:
  application:
    name: samanvay-tasklist
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

samanvay:
  engine:
    # Camunda 7 REST API of the Samanvay BPM engine
    base-url: ${SAMANVAY_ENGINE_BASE_URL:http://localhost:8080/engine-rest}
    # service account the tasklist uses to call the engine; never sent to the browser
    username: ${SAMANVAY_ENGINE_USERNAME:demo}
    password: ${SAMANVAY_ENGINE_PASSWORD:demo}
    connect-timeout: 5s
    read-timeout: 15s
  tasklist:
    # Camunda groups whose members may manage form configuration
    admin-groups: ${SAMANVAY_TASKLIST_ADMIN_GROUPS:camunda-admin,tasklist-admin}
